name: Bug report
description: 报告补丁无法安装、启动或运行的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传游戏程序、汉化文件、存档、音频、图片或其他游戏资源。
  - type: input
    id: patch-version
    attributes:
      label: 补丁版本
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: game-sha256
    attributes:
      label: BaldrForce.exe SHA-256
      description: 只填写哈希，不要上传游戏程序。
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: 问题现象和错误原文
    validations:
      required: true
  - type: dropdown
    id: display-mode
    attributes:
      label: 显示模式
      options:
        - 窗口化
        - 无边框全屏
        - 传统独占全屏
        - 尚未进入设置或不适用
    validations:
      required: true
  - type: input
    id: window-size
    attributes:
      label: 窗口分辨率（如适用）
      placeholder: 960 x 720
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我使用 Start-BaldrForce.exe 启动，而不是直接运行游戏程序。
          required: true
        - label: 我没有上传或附带任何游戏或汉化资源。
          required: true
