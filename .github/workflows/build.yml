name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MinGW-w64 to PATH
        shell: pwsh
        run: |
          $MingwDirectory = 'C:\mingw64\bin'
          if (!(Test-Path -LiteralPath (Join-Path $MingwDirectory 'gcc.exe'))) {
            throw "GitHub-hosted MinGW-w64 was not found at $MingwDirectory"
          }
          $MingwDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build launcher
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Run native configuration tests
        shell: pwsh
        run: .\scripts\test.ps1
      - name: Test release packaging
        shell: pwsh
        run: .\scripts\test-package.ps1
      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: Start-BaldrForce
          path: build/Start-BaldrForce.exe
